      /env.js lo genera el contenedor en tiempo de arranque (ver
      infrastructure/docker/web-entrypoint.sh), no el build de Vite. Permite

      imagen (necesario en Render, que no soporta build args de Docker por
      Blueprint). En desarrollo local esta petición da 404 y no pasa nada:
      se usan las variables de import.meta.env de siempre.
    -->
