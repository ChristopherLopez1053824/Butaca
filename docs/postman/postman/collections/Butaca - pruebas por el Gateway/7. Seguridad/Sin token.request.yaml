$kind: http-request
url: "{{baseUrl}}/api/users/me"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 401', () => pm.response.to.have.status(401));
      pm.test('code UNAUTHORIZED', () => pm.expect(pm.response.json().code).to.eql('UNAUTHORIZED'));
    language: text/javascript
order: 1000
