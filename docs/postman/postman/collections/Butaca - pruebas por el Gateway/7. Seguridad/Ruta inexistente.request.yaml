$kind: http-request
url: "{{baseUrl}}/api/no-existe"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 404', () => pm.response.to.have.status(404));
      pm.test('code NOT_FOUND', () => pm.expect(pm.response.json().code).to.eql('NOT_FOUND'));
    language: text/javascript
order: 4000
