$kind: http-request
description: Dashboard consulta Emotion, Movie, Favorites y Meme. advertencias es null si todos respondieron.
url: "{{baseUrl}}/api/dashboard/summary"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200));
      const resumen = pm.response.json().data;
      pm.test('Todos los servicios respondieron', () => pm.expect(resumen.advertencias).to.eql(null));
      pm.test('Cuenta emociones y memes', () => { pm.expect(resumen.resumen.totalEmociones).to.be.above(0); pm.expect(resumen.resumen.totalMemes).to.be.above(0); });
    language: text/javascript
order: 5000
