$kind: http-request
url: "{{baseUrl}}/api/favorites"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "tmdbId": 550,
      "mediaType": "MOVIE",
      "title": "Fight Club",
      "userId": "otro-usuario"
    }
scripts:
  - type: afterResponse
    code: pm.test('Responde 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
